<script>
  // Bag-ong gi-update nga Google Apps Script Web App URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGInehLYpXzd-dc8pJFO2Q-NsOMkp92QaO0OG8Z4nLXjrAIayT-ud95oAEVRL4v2y2ow/exec";

  let inventoryData = { books: [], boys: [], girls: [] };

  document.addEventListener("DOMContentLoaded", () => {
    loadAllData();
    updateLiveTimestamps();
    setInterval(updateLiveTimestamps, 1000);
  });

  function openTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    document.getElementById(tabName).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  function getCurrentDateTime() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    
    hours = hours % 12;
    hours = hours ? hours : 12;
    const strHours = String(hours).padStart(2, '0');

    return `${year}-${month}-${day} ${strHours}:${minutes}:${seconds} ${ampm}`;
  }

  function updateLiveTimestamps() {
    if (!document.getElementById("bookId").value) {
      document.getElementById("bookDateAdded").value = getCurrentDateTime();
    }
    if (!document.getElementById("boysId").value) {
      document.getElementById("boysDateAdded").value = getCurrentDateTime();
    }
    if (!document.getElementById("girlsId").value) {
      document.getElementById("girlsDateAdded").value = getCurrentDateTime();
    }
  }

  // AUTOMATIC CALCULATION FUNCTION
  function calculateAvailable(prefix) {
    const added = parseFloat(document.getElementById(`${prefix}Added`).value) || 0;
    const taken = parseFloat(document.getElementById(`${prefix}Taken`).value) || 0;
    
    const available = added - taken;
    document.getElementById(`${prefix}Available`).value = available >= 0 ? available : 0;
  }

  function loadAllData() {
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "readAll" })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        inventoryData.books = data.books || [];
        inventoryData.boys = data.boys || [];
        inventoryData.girls = data.girls || [];

        renderBooksTable();
        renderUniformTable('Boys');
        renderUniformTable('Girls');
      }
    })
    .catch(err => console.error("Error loading data:", err));
  }

  // --- BOOKS ---
  function renderBooksTable() {
    const tbody = document.getElementById("booksTableBody");
    tbody.innerHTML = "";

    if (inventoryData.books.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8">No books found.</td></tr>';
      return;
    }

    inventoryData.books.forEach(b => {
      const added = Number(b.Added || b['Total Added'] || b.added || 0);
      const taken = Number(b.Taken || b['Total Taken'] || b.taken || 0);
      const available = added - taken;

      tbody.innerHTML += `
        <tr>
          <td>${b.Title || b.title || ''}</td>
          <td>${b.Author || b.author || ''}</td>
          <td>₱${Number(b.Price || b.price || 0).toFixed(2)}</td>
          <td>${b.DateAdded || b.dateAdded || ''}</td>
          <td>${added}</td>
          <td>${taken}</td>
          <td><span class="badge ${available > 0 ? 'bg-green' : 'bg-red'}">${available}</span></td>
          <td>
            <button class="btn btn-edit" onclick="editBook('${b.ID || b.id}')">Edit</button>
            <button class="btn btn-delete" onclick="deleteItem('Books', '${b.ID || b.id}')">Delete</button>
          </td>
        </tr>
      `;
    });
  }

  document.getElementById("bookForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const id = document.getElementById("bookId").value;
    const isNew = !id;
    const bookId = isNew ? "BOOK-" + Date.now() : id;

    const payload = {
      action: "saveBook",
      data: {
        id: bookId,
        title: document.getElementById("bookTitle").value,
        author: document.getElementById("bookAuthor").value,
        price: parseFloat(document.getElementById("bookPrice").value),
        dateAdded: document.getElementById("bookDateAdded").value,
        added: parseInt(document.getElementById("bookAdded").value) || 0,
        taken: parseInt(document.getElementById("bookTaken").value) || 0
      }
    };

    saveData(payload, resetBookForm);
  });

  function editBook(id) {
    const book = inventoryData.books.find(b => (b.ID || b.id) == id);
    if (!book) return;

    document.getElementById("bookId").value = book.ID || book.id;
    document.getElementById("bookTitle").value = book.Title || book.title || '';
    document.getElementById("bookAuthor").value = book.Author || book.author || '';
    document.getElementById("bookPrice").value = book.Price || book.price || 0;
    document.getElementById("bookDateAdded").value = book.DateAdded || book.dateAdded || getCurrentDateTime();
    document.getElementById("bookAdded").value = book.Added || book['Total Added'] || 0;
    document.getElementById("bookTaken").value = book.Taken || book['Total Taken'] || 0;

    calculateAvailable('book');
    document.getElementById("cancelBookBtn").style.display = "inline-block";
  }

  function resetBookForm() {
    document.getElementById("bookForm").reset();
    document.getElementById("bookId").value = "";
    document.getElementById("cancelBookBtn").style.display = "none";
    calculateAvailable('book');
    updateLiveTimestamps();
  }

  // --- UNIFORMS (BOYS / GIRLS) ---
  function renderUniformTable(category) {
    const isBoys = category === 'Boys';
    const tbody = document.getElementById(isBoys ? "boysTableBody" : "girlsTableBody");
    const list = isBoys ? inventoryData.boys : inventoryData.girls;
    tbody.innerHTML = "";

    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8">No ${category.toLowerCase()} uniforms found.</td></tr>`;
      return;
    }

    list.forEach(u => {
      const added = Number(u.Added || u['Total Added'] || u.added || 0);
      const taken = Number(u.Taken || u['Total Taken'] || u.taken || 0);
      const available = added - taken;
      const sheetName = isBoys ? "Boys Uniforms" : "Girls Uniforms";

      tbody.innerHTML += `
        <tr>
          <td>${u.Type || u.type || ''}</td>
          <td>${u.Size || u.size || ''}</td>
          <td>₱${Number(u.Price || u.price || 0).toFixed(2)}</td>
          <td>${u.DateAdded || u.dateAdded || ''}</td>
          <td>${added}</td>
          <td>${taken}</td>
          <td><span class="badge ${available > 0 ? 'bg-green' : 'bg-red'}">${available}</span></td>
          <td>
            <button class="btn btn-edit" onclick="editUniform('${category}', '${u.ID || u.id}')">Edit</button>
            <button class="btn btn-delete" onclick="deleteItem('${sheetName}', '${u.ID || u.id}')">Delete</button>
          </td>
        </tr>
      `;
    });
  }

  function setupUniformSubmit(category) {
    const isBoys = category === 'Boys';
    const prefix = isBoys ? 'boys' : 'girls';

    document.getElementById(`${prefix}Form`).addEventListener("submit", function(e) {
      e.preventDefault();
      const id = document.getElementById(`${prefix}Id`).value;
      const isNew = !id;
      const uniformId = isNew ? (isBoys ? "BOY-" : "GIRL-") + Date.now() : id;

      const payload = {
        action: "saveUniform",
        data: {
          category: category,
          id: uniformId,
          type: document.getElementById(`${prefix}Type`).value,
          size: document.getElementById(`${prefix}Size`).value,
          price: parseFloat(document.getElementById(`${prefix}Price`).value),
          dateAdded: document.getElementById(`${prefix}DateAdded`).value,
          added: parseInt(document.getElementById(`${prefix}Added`).value) || 0,
          taken: parseInt(document.getElementById(`${prefix}Taken`).value) || 0
        }
      };

      saveData(payload, () => resetUniformForm(category));
    });
  }

  setupUniformSubmit('Boys');
  setupUniformSubmit('Girls');

  function editUniform(category, id) {
    const isBoys = category === 'Boys';
    const prefix = isBoys ? 'boys' : 'girls';
    const list = isBoys ? inventoryData.boys : inventoryData.girls;
    const item = list.find(u => (u.ID || u.id) == id);
    if (!item) return;

    document.getElementById(`${prefix}Id`).value = item.ID || item.id;
    document.getElementById(`${prefix}Type`).value = item.Type || item.type || '';
    document.getElementById(`${prefix}Size`).value = item.Size || item.size || '';
    document.getElementById(`${prefix}Price`).value = item.Price || item.price || 0;
    document.getElementById(`${prefix}DateAdded`).value = item.DateAdded || item.dateAdded || getCurrentDateTime();
    document.getElementById(`${prefix}Added`).value = item.Added || item['Total Added'] || 0;
    document.getElementById(`${prefix}Taken`).value = item.Taken || item['Total Taken'] || 0;

    calculateAvailable(prefix);
    document.getElementById(`cancel${category}Btn`).style.display = "inline-block";
  }

  function resetUniformForm(category) {
    const prefix = category === 'Boys' ? 'boys' : 'girls';
    document.getElementById(`${prefix}Form`).reset();
    document.getElementById(`${prefix}Id`).value = "";
    document.getElementById(`cancel${category}Btn`).style.display = "none";
    calculateAvailable(prefix);
    updateLiveTimestamps();
  }

  function saveData(payload, resetCallback) {
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        resetCallback();
        loadAllData();
      } else {
        alert("Error saving: " + res.message);
      }
    })
    .catch(err => console.error("Error:", err));
  }

  function deleteItem(sheetName, id) {
    if (!confirm("Sigurado ka ba nga gusto nimo kini i-delete?")) return;

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "deleteItem", sheetName: sheetName, id: id })
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        loadAllData();
      } else {
        alert("Error deleting item.");
      }
    })
    .catch(err => console.error("Error:", err));
  }
</script>
